<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI Chat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gemini: {
                            bgLight: '#f8f9fa',
                            sidebarLight: '#f0f4f9',
                            bgDark: '#131314',
                            sidebarDark: '#1e1f20',
                            cardDark: '#282a2c',
                            accent: '#1a73e8'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Fallback loader styling */
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
            color: #1f2937;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 1.25rem;
            font-weight: 500;
            z-index: 9999;
        }
        .dark #loading {
            background-color: #131314;
            color: #f3f4f6;
        }
        /* Prose customization for markdown output */
        .markdown-body p { margin-bottom: 0.75rem; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body pre {
            background-color: #1e1f20;
            color: #e3e3e3;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.75rem 0;
        }
        .markdown-body code {
            font-family: monospace;
            background-color: rgba(0,0,0,0.06);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
        }
        .dark .markdown-body code {
            background-color: rgba(255,255,255,0.1);
        }
        .markdown-body pre code {
            background-color: transparent;
            padding: 0;
        }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.6); }
    </style>
</head>
<body class="h-full bg-gemini-bgLight dark:bg-gemini-bgDark text-gray-800 dark:text-gray-200 antialiased selection:bg-blue-200 dark:selection:bg-blue-900">

    <!-- Loading Fallback Screen -->
    <div id="loading">
        <div class="flex items-center space-x-3">
            <i class="fa-solid font-sharp fa-circle-notch animate-spin text-blue-600 text-2xl"></i>
            <span>Initializing App...</span>
        </div>
    </div>

    <!-- Main Container Layout -->
    <div id="app" class="hidden flex h-full w-full overflow-hidden relative">
        
        <!-- Mobile Overlay -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden transition-opacity duration-300"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-72 bg-gemini-sidebarLight dark:bg-gemini-sidebarDark flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out border-r border-gray-200 dark:border-gray-800">
            <!-- Sidebar Header / New Chat -->
            <div class="p-4 flex items-center justify-between">
                <button id="btn-new-chat" class="flex-1 flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white py-2.5 px-4 rounded-full font-medium transition-colors shadow-sm">
                    <i class="fa-solid fa-plus"></i>
                    <span>New Chat</span>
                </button>
                <button id="btn-close-sidebar" class="md:hidden ml-2 p-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Chat History List -->
            <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1" id="chat-list">
                <!-- Chat history items dynamically injected here -->
            </div>

            <!-- Sidebar Footer Controls -->
            <div class="p-3 border-t border-gray-200 dark:border-gray-800 space-y-1">
                <button id="btn-toggle-theme" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800 text-sm font-medium transition-colors">
                    <i id="theme-icon" class="fa-solid fa-moon w-5 text-center"></i>
                    <span id="theme-text">Dark Mode</span>
                </button>
                <button id="btn-open-system" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800 text-sm font-medium transition-colors">
                    <i class="fa-solid fa-sliders w-5 text-center"></i>
                    <span>System Prompt</span>
                </button>
                <button id="btn-open-settings" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800 text-sm font-medium transition-colors">
                    <i class="fa-solid fa-gear w-5 text-center"></i>
                    <span>Settings</span>
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col min-w-0 h-full relative">
            
            <!-- Mobile Header Bar -->
            <header class="flex md:hidden items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-gray-800 bg-gemini-bgLight dark:bg-gemini-bgDark z-10">
                <button id="btn-open-sidebar" class="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <span id="mobile-chat-title" class="font-medium text-sm truncate max-w-[200px]">New Chat</span>
                <button id="btn-mobile-new-chat" class="p-2 text-blue-600 dark:text-blue-400">
                    <i class="fa-solid fa-pen-to-square text-xl"></i>
                </button>
            </header>

            <!-- Messages Stream Wrapper -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                <!-- Welcome View (Shown when current chat is empty) -->
                <div id="welcome-view" class="h-full flex flex-col items-center justify-center text-center px-4 max-w-xl mx-auto space-y-4">
                    <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 rounded-full flex items-center justify-center text-3xl">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <h1 class="text-2xl md:text-3xl font-semibold tracking-tight">How can I help you today?</h1>
                    <p class="text-sm text-gray-500 dark:text-gray-400">Ask a question, generate ideas, analyze text, or start writing code.</p>
                </div>

                <!-- Active Chat Messages Render Area -->
                <div id="messages-list" class="max-w-3xl mx-auto space-y-6 w-full hidden">
                    <!-- Dynamic Messages Output -->
                </div>
            </div>

            <!-- Sticky Bottom Input Area -->
            <div class="p-3 md:p-4 bg-gemini-bgLight dark:bg-gemini-bgDark border-t border-gray-200/50 dark:border-gray-800/50">
                <div class="max-w-3xl mx-auto relative">
                    <form id="chat-form" class="relative flex items-end bg-white dark:bg-gemini-cardDark border border-gray-300 dark:border-gray-700 rounded-2xl shadow-sm focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-transparent transition-all">
                        <textarea 
                            id="user-input" 
                            rows="1" 
                            placeholder="Message AI..." 
                            class="w-full resize-none bg-transparent py-3.5 pl-4 pr-12 text-sm md:text-base focus:outline-none text-gray-800 dark:text-gray-100 max-h-48 overflow-y-auto"
                            style="min-height: 52px;"></textarea>
                        <button 
                            type="submit" 
                            id="btn-send"
                            disabled
                            class="absolute right-2 bottom-2 p-2 rounded-xl text-gray-400 hover:text-white hover:bg-blue-600 disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-gray-400 transition-colors">
                            <i class="fa-solid fa-paper-plane text-lg"></i>
                        </button>
                    </form>
                    <div class="text-[11px] text-center text-gray-400 dark:text-gray-500 mt-2">
                        AI may present inaccurate information. Always verify responses.
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Modal: Settings -->
    <div id="modal-settings" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-gemini-sidebarDark rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4 border border-gray-200 dark:border-gray-800">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-semibold">API & Model Settings</h3>
                <button class="btn-close-modal text-gray-400 hover:text-gray-600 dark:hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">OpenRouter API Key</label>
                    <input type="password" id="input-api-key" placeholder="••••••••••••••••••••••••••••" class="w-full px-3 py-2 bg-gray-50 dark:bg-gemini-cardDark border border-gray-300 dark:border-gray-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <p class="text-[11px] text-gray-500 dark:text-gray-400 mt-1">Pre-configured key active. Override here if desired.</p>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Model Name</label>
                    <input type="text" id="input-model" class="w-full px-3 py-2 bg-gray-50 dark:bg-gemini-cardDark border border-gray-300 dark:border-gray-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button id="btn-save-settings" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors">Save Settings</button>
            </div>
        </div>
    </div>

    <!-- Modal: System Prompt -->
    <div id="modal-system" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-gemini-sidebarDark rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4 border border-gray-200 dark:border-gray-800">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-semibold">System Instructions</h3>
                <button class="btn-close-modal text-gray-400 hover:text-gray-600 dark:hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Global System Prompt</label>
                <textarea id="input-system-prompt" rows="5" placeholder="You are a helpful, respectful, and honest assistant..." class="w-full px-3 py-2 bg-gray-50 dark:bg-gemini-cardDark border border-gray-300 dark:border-gray-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button id="btn-save-system" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors">Save Instructions</button>
            </div>
        </div>
    </div>

    <!-- SINGLE SCRIPT TAG AT THE VERY END OF BODY -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Preset configuration
            const DEFAULT_API_KEY = "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";
            const DEFAULT_MODEL = "nvidia/nemotron-3-ultra-550b-a55b:free";
            const API_ENDPOINT = "https://openrouter.ai/api/v1/chat/completions";

            // State management
            let state = {
                apiKey: localStorage.getItem('ai_api_key') || DEFAULT_API_KEY,
                model: localStorage.getItem('ai_model') || DEFAULT_MODEL,
                systemPrompt: localStorage.getItem('ai_system_prompt') || "You are a helpful, smart, and precise AI assistant.",
                darkMode: localStorage.getItem('ai_dark_mode') === 'true',
                chats: JSON.parse(localStorage.getItem('ai_chats') || '[]'),
                activeChatId: localStorage.getItem('ai_active_chat_id') || null,
                isGenerating: false
            };

            // DOM Elements
            const loadingEl = document.getElementById('loading');
            const appEl = document.getElementById('app');
            const sidebarEl = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebar-overlay');
            const chatListEl = document.getElementById('chat-list');
            const messagesContainer = document.getElementById('messages-container');
            const messagesListEl = document.getElementById('messages-list');
            const welcomeViewEl = document.getElementById('welcome-view');
            const userInputEl = document.getElementById('user-input');
            const chatFormEl = document.getElementById('chat-form');
            const btnSendEl = document.getElementById('btn-send');
            const mobileChatTitle = document.getElementById('mobile-chat-title');

            // Initialize theme UI
            function applyTheme() {
                if (state.darkMode) {
                    document.documentElement.classList.add('dark');
                    document.getElementById('theme-icon').className = 'fa-solid fa-sun w-5 text-center';
                    document.getElementById('theme-text').textContent = 'Light Mode';
                } else {
                    document.documentElement.classList.remove('dark');
                    document.getElementById('theme-icon').className = 'fa-solid fa-moon w-5 text-center';
                    document.getElementById('theme-text').textContent = 'Dark Mode';
                }
            }

            function saveState() {
                localStorage.setItem('ai_api_key', state.apiKey);
                localStorage.setItem('ai_model', state.model);
                localStorage.setItem('ai_system_prompt', state.systemPrompt);
                localStorage.setItem('ai_dark_mode', state.darkMode);
                localStorage.setItem('ai_chats', JSON.stringify(state.chats));
                localStorage.setItem('ai_active_chat_id', state.activeChatId || '');
            }

            // Chat helper methods
            function createNewChat() {
                const newChat = {
                    id: 'chat_' + Date.now(),
                    title: 'New Chat',
                    messages: []
                };
                state.chats.unshift(newChat);
                state.activeChatId = newChat.id;
                saveState();
                renderChats();
                renderMessages();
                closeSidebarMobile();
            }

            function getActiveChat() {
                return state.chats.find(c => c.id === state.activeChatId);
            }

            function deleteChat(id, e) {
                e.stopPropagation();
                state.chats = state.chats.filter(c => c.id !== id);
                if (state.activeChatId === id) {
                    state.activeChatId = state.chats.length > 0 ? state.chats[0].id : null;
                }
                saveState();
                renderChats();
                renderMessages();
            }

            function renameChat(id, e) {
                e.stopPropagation();
                const chat = state.chats.find(c => c.id === id);
                if (!chat) return;
                const newTitle = prompt('Enter new chat title:', chat.title);
                if (newTitle && newTitle.trim()) {
                    chat.title = newTitle.trim();
                    saveState();
                    renderChats();
                    if (state.activeChatId === id) {
                        mobileChatTitle.textContent = chat.title;
                    }
                }
            }

            // UI Render Functions
            function renderChats() {
                chatListEl.innerHTML = '';
                state.chats.forEach(chat => {
                    const isActive = chat.id === state.activeChatId;
                    const item = document.createElement('div');
                    item.className = `group flex items-center justify-between px-3 py-2.5 rounded-lg cursor-pointer text-sm font-medium transition-colors ${
                        isActive 
                            ? 'bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400' 
                            : 'hover:bg-gray-200/60 dark:hover:bg-gray-800/60 text-gray-700 dark:text-gray-300'
                    }`;
                    
                    item.innerHTML = `
                        <div class="flex items-center space-x-3 truncate mr-2">
                            <i class="fa-regular fa-message text-xs"></i>
                            <span class="truncate">${escapeHtml(chat.title)}</span>
                        </div>
                        <div class="hidden group-hover:flex items-center space-x-1">
                            <button class="btn-rename p-1 hover:text-blue-500"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button class="btn-delete p-1 hover:text-red-500"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    `;

                    item.addEventListener('click', () => {
                        state.activeChatId = chat.id;
                        saveState();
                        renderChats();
                        renderMessages();
                        closeSidebarMobile();
                    });

                    item.querySelector('.btn-rename').addEventListener('click', (e) => renameChat(chat.id, e));
                    item.querySelector('.btn-delete').addEventListener('click', (e) => deleteChat(chat.id, e));

                    chatListEl.appendChild(item);
                });
            }

            function renderMessages() {
                const activeChat = getActiveChat();
                if (!activeChat || activeChat.messages.length === 0) {
                    welcomeViewEl.classList.remove('hidden');
                    messagesListEl.classList.add('hidden');
                    mobileChatTitle.textContent = 'New Chat';
                    return;
                }

                welcomeViewEl.classList.add('hidden');
                messagesListEl.classList.remove('hidden');
                messagesListEl.innerHTML = '';
                mobileChatTitle.textContent = activeChat.title;

                activeChat.messages.forEach(msg => {
                    appendMessageUI(msg.role, msg.content);
                });

                scrollToBottom();
            }

            function appendMessageUI(role, content = '') {
                const isUser = role === 'user';
                const wrapper = document.createElement('div');
                wrapper.className = `flex ${isUser ? 'justify-end' : 'justify-start'} w-full`;

                const msgCard = document.createElement('div');
                msgCard.className = isUser
                    ? 'bg-blue-600 text-white rounded-2xl rounded-tr-none px-4 py-3 max-w-[85%] md:max-w-[75%] shadow-sm text-sm md:text-base'
                    : 'bg-white dark:bg-gemini-cardDark border border-gray-200 dark:border-gray-800 rounded-2xl rounded-tl-none px-4 py-3 max-w-[90%] md:max-w-[80%] shadow-sm text-sm md:text-base text-gray-800 dark:text-gray-100 markdown-body';

                if (isUser) {
                    msgCard.textContent = content;
                } else {
                    msgCard.innerHTML = marked.parse(content || '');
                }

                wrapper.appendChild(msgCard);
                messagesListEl.appendChild(wrapper);
                scrollToBottom();
                return msgCard;
            }

            function scrollToBottom() {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function escapeHtml(str) {
                return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
            }

            // Streaming API logic
            async function handleSubmit(e) {
                if (e) e.preventDefault();
                const text = userInputEl.value.trim();
                if (!text || state.isGenerating) return;

                // Ensure active chat
                if (!state.activeChatId || !getActiveChat()) {
                    createNewChat();
                }

                const activeChat = getActiveChat();
                if (activeChat.messages.length === 0) {
                    // Title assignment for first prompt
                    activeChat.title = text.slice(0, 28) + (text.length > 28 ? '...' : '');
                    renderChats();
                }

                // Append user message
                activeChat.messages.push({ role: 'user', content: text });
                userInputEl.value = '';
                userInputEl.style.height = 'auto';
                btnSendEl.disabled = true;
                renderMessages();

                state.isGenerating = true;

                // Prepare AI output element
                const aiMsgCard = appendMessageUI('assistant', '');
                let fullResponse = '';

                // Build context messages including system prompt
                const apiMessages = [
                    { role: 'system', content: state.systemPrompt },
                    ...activeChat.messages.map(m => ({ role: m.role, content: m.content }))
                ];

                try {
                    const response = await fetch(API_ENDPOINT, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${state.apiKey}`
                        },
                        body: JSON.stringify({
                            model: state.model,
                            messages: apiMessages,
                            stream: true
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP Error ${response.status}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';

                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (!trimmed || trimmed.startsWith(':')) continue;
                            if (trimmed === 'data: [DONE]') break;

                            if (trimmed.startsWith('data: ')) {
                                try {
                                    const parsed = JSON.parse(trimmed.slice(6));
                                    const token = parsed.choices?.[0]?.delta?.content || '';
                                    fullResponse += token;
                                    aiMsgCard.innerHTML = marked.parse(fullResponse);
                                    scrollToBottom();
                                } catch (err) {
                                    // Non-fatal parse warning
                                }
                            }
                        }
                    }

                    // Append completed message
                    activeChat.messages.push({ role: 'assistant', content: fullResponse });
                    saveState();

                } catch (err) {
                    console.error(err);
                    aiMsgCard.innerHTML = `<span class="text-red-500"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Error generating response. Check API configuration.</span>`;
                } finally {
                    state.isGenerating = false;
                    btnSendEl.disabled = userInputEl.value.trim().length === 0;
                }
            }

            // Mobile Navigation Helpers
            function openSidebarMobile() {
                sidebarEl.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            }

            function closeSidebarMobile() {
                sidebarEl.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }

            // Event Listeners
            document.getElementById('btn-open-sidebar').addEventListener('click', openSidebarMobile);
            document.getElementById('btn-close-sidebar').addEventListener('click', closeSidebarMobile);
            sidebarOverlay.addEventListener('click', closeSidebarMobile);
            
            document.getElementById('btn-new-chat').addEventListener('click', createNewChat);
            document.getElementById('btn-mobile-new-chat').addEventListener('click', createNewChat);

            document.getElementById('btn-toggle-theme').addEventListener('click', () => {
                state.darkMode = !state.darkMode;
                applyTheme();
                saveState();
            });

            // Input auto-grow and submit trigger
            userInputEl.addEventListener('input', () => {
                userInputEl.style.height = 'auto';
                userInputEl.style.height = Math.min(userInputEl.scrollHeight, 192) + 'px';
                btnSendEl.disabled = userInputEl.value.trim().length === 0 || state.isGenerating;
            });

            userInputEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSubmit();
                }
            });

            chatFormEl.addEventListener('submit', handleSubmit);

            // Modals Logic
            const modalSettings = document.getElementById('modal-settings');
            const modalSystem = document.getElementById('modal-system');

            document.getElementById('btn-open-settings').addEventListener('click', () => {
                document.getElementById('input-api-key').value = state.apiKey === DEFAULT_API_KEY ? '' : state.apiKey;
                document.getElementById('input-model').value = state.model;
                modalSettings.classList.remove('hidden');
            });

            document.getElementById('btn-open-system').addEventListener('click', () => {
                document.getElementById('input-system-prompt').value = state.systemPrompt;
                modalSystem.classList.remove('hidden');
            });

            document.querySelectorAll('.btn-close-modal').forEach(btn => {
                btn.addEventListener('click', () => {
                    modalSettings.classList.add('hidden');
                    modalSystem.classList.add('hidden');
                });
            });

            document.getElementById('btn-save-settings').addEventListener('click', () => {
                const customKey = document.getElementById('input-api-key').value.trim();
                state.apiKey = customKey || DEFAULT_API_KEY;
                state.model = document.getElementById('input-model').value.trim() || DEFAULT_MODEL;
                saveState();
                modalSettings.classList.add('hidden');
            });

            document.getElementById('btn-save-system').addEventListener('click', () => {
                state.systemPrompt = document.getElementById('input-system-prompt').value.trim();
                saveState();
                modalSystem.classList.add('hidden');
            });

            // Initial startup sequencing
            applyTheme();
            renderChats();
            renderMessages();

            // Safely remove loading overlay and show app
            loadingEl.style.display = 'none';
            appEl.classList.remove('hidden');
        });
    </script>
</body>
</html>
